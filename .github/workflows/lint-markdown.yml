name: Lint Markdown

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install markdownlint-cli
        run: |
          sudo apt-get update -y
          sudo apt-get install -y nodejs npm
          npm install -g markdownlint-cli
      - name: Run markdownlint
        run: |
          markdownlint "**/*.md" || true
