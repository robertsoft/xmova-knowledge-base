# Branch protection template (informational)
#
# Este arquivo é apenas um template e serve como documentação/registro das
# regras de proteção recomendadas. Para aplicar automaticamente as regras
# use o script `scripts/apply_branch_protection.sh` (requer `GITHUB_TOKEN`).

rules:
  - name: Protect main
    pattern: main
    protection:
      required_status_checks:
        strict: true
        contexts:
          - ci/build
      require_pull_request_reviews: true
      require_code_owner_reviews: true
      required_linear_history: true
      enforce_admins: true
      required_conversation_resolution: true
      allow_force_pushes: false
      allow_deletions: false
